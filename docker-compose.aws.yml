services:
  auth-migrate:
    build:
      context: ./Auth
      target: migrator
    environment:
      ConnectionStrings__AuthDb: Host=${DB_HOST};Port=5432;Database=auth_db;Username=postgres;Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      redis__ConnectionString: redis:6379
    depends_on:
      redis:
        condition: service_healthy

  ride-migrate:
    build:
      context: ./Ride
      target: migrator
    environment:
      ConnectionStrings__RideDb: Host=${DB_HOST};Port=5432;Database=ride_db;Username=postgres;Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY}

  auth:
    build:
      context: ./Auth
      target: final   # migrator is now the LAST stage, so name the API stage
    restart: unless-stopped
    ports: ["5218:8080"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ConnectionStrings__AuthDb: Host=${DB_HOST};Port=5432;Database=auth_db;Username=postgres;Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      redis__ConnectionString: redis:6379
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ride:
    build:
      context: ./Ride
      target: final
    restart: unless-stopped
    ports: ["5219:8080"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ConnectionStrings__RideDb: Host=${DB_HOST};Port=5432;Database=ride_db;Username=postgres;Password=${DB_PASSWORD}
      Kafka__BootstrapServers: kafka:29092
      Jwt__Key: ${JWT_KEY}
    depends_on:
      ride-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  driver:
    build: ./Driver
    restart: unless-stopped
    ports: ["5220:8080"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Kafka__BootstrapServers: kafka:29092
      Jwt__Key: ${JWT_KEY}
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092,CONTROLLER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafkadata:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list; do sleep 2; done;
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic ride-events --partitions 3 --replication-factor 1"

  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol/config.yaml:ro

volumes:
  redisdata:
  kafkadata:
