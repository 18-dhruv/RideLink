services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  auth:
    build: ./Auth
    ports: ["5218:8080"]
    environment:
      ConnectionStrings__AuthDb: Host=postgres;Port=5432;Database=auth_db;Username=postgres;Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ride:
    build: ./Ride
    ports: ["5219:8080"]
    environment:
      ConnectionStrings__RideDb: Host=postgres;Port=5432;Database=ride_db;Username=postgres;Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  driver:
    build: ./Driver
    ports: ["5220:8080"]
    environment:
      Jwt__Key: ${JWT_KEY}
  
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ","ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
